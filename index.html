<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UX Recommendations</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial, Helvetica, sans-serif;
  background:linear-gradient(135deg,#eef5ff,#f8fbff);
  color:#172033;
}

.container{
  width:min(1050px,92%);
  margin:auto;
}

/* HEADER */

header{
  text-align:center;
  padding:55px 15px 30px;
}

.badge{
  display:inline-block;
  padding:9px 16px;
  border-radius:30px;
  background:#e1edff;
  color:#2463c5;
  font-size:12px;
  font-weight:800;
  letter-spacing:1.5px;
}

h1{
  font-size:clamp(40px,7vw,72px);
  margin:16px 0 10px;
  letter-spacing:-3px;
}

.subtitle{
  color:#657084;
  font-size:17px;
  line-height:1.6;
  margin:auto;
  max-width:700px;
}

/* SEARCH */

.search{
  margin:28px auto 10px;
  display:flex;
  gap:10px;
  max-width:720px;
}

#appName{
  flex:1;
  padding:18px 20px;
  border:1px solid #d9e1ee;
  border-radius:15px;
  outline:none;
  background:white;
  font-size:16px;
  box-shadow:0 8px 25px rgba(29,78,216,.06);
}

#appName:focus{
  border-color:#2463c5;
  box-shadow:0 0 0 3px rgba(36,99,197,.12);
}

button{
  border:0;
  border-radius:14px;
  padding:0 25px;
  min-height:52px;
  background:#2463c5;
  color:white;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
  transition:.2s;
}

button:hover{
  transform:translateY(-2px);
  opacity:.92;
}

.error{
  display:none;
  color:#d64545;
  font-size:13px;
  font-weight:700;
  margin-top:10px;
}

/* CARDS */

.card{
  background:rgba(255,255,255,.94);
  border:1px solid #e1e7f0;
  border-radius:22px;
  padding:26px;
  box-shadow:0 15px 45px rgba(23,52,92,.08);
  margin:20px 0;
}

/* IMPORTANT:
   Checklist is hidden initially.
*/

#problemCard{
  display:none;
}

#result{
  display:none;
}

.card h2{
  margin:0 0 6px;
  font-size:21px;
}

.small{
  color:#788398;
  font-size:13px;
  line-height:1.5;
  margin-bottom:20px;
}

/* CHECKBOX GRID */

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:13px;
}

.problem{
  display:flex;
  align-items:flex-start;
  gap:13px;
  padding:17px;
  border:1px solid #e3e8f1;
  border-radius:15px;
  background:#fbfcfe;
  cursor:pointer;
  transition:.2s;
}

.problem:hover{
  border-color:#9abcf0;
  background:#f5f9ff;
  transform:translateY(-1px);
}

.problem input{
  width:19px;
  height:19px;
  margin-top:2px;
  accent-color:#2463c5;
  cursor:pointer;
}

.problem strong{
  display:block;
  font-size:14px;
  color:#172033;
}

.problem span{
  display:block;
  color:#7a8495;
  font-size:12px;
  line-height:1.5;
  margin-top:5px;
}

/* BUTTON */

.actions{
  text-align:center;
  margin:26px 0 4px;
}

.actions button{
  min-width:250px;
}

/* RESULT */

.result-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:16px;
  padding-bottom:18px;
  margin-bottom:18px;
  border-bottom:1px solid #e6ebf2;
}

.result-header h2{
  font-size:25px;
}

.context-pill{
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:9px 14px;
  border-radius:999px;
  background:#edf4ff;
  color:#2463c5;
  font-size:12px;
  font-weight:800;
}

/* SUMMARY */

.analysis-summary{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-bottom:20px;
}

.summary-box{
  padding:17px;
  border:1px solid #e3e8f1;
  border-radius:15px;
  background:#fbfcfe;
}

.summary-box span{
  display:block;
  color:#7b8697;
  font-size:11px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.7px;
}

.summary-box strong{
  display:block;
  font-size:21px;
  margin-top:6px;
}

/* RECOMMENDATIONS */

.result-item{
  border-left:4px solid #2463c5;
  background:#f7faff;
  border-radius:12px;
  padding:18px;
  margin:13px 0;
}

.result-item h3{
  margin:0 0 8px;
  font-size:16px;
}

.result-item p{
  margin:0;
  color:#596578;
  line-height:1.65;
  font-size:14px;
}

.result-item .reason{
  margin-top:10px;
  padding-top:10px;
  border-top:1px solid #e1e9f5;
  font-size:13px;
}

/* SCORE */

.score{
  display:flex;
  gap:12px;
  align-items:center;
  margin-top:24px;
}

.scorebar{
  height:10px;
  background:#e6ebf3;
  border-radius:20px;
  flex:1;
  overflow:hidden;
}

.scorebar i{
  display:block;
  height:100%;
